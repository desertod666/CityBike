[env:esp32c3]
platform = espressif32@6.12.0
platform_packages =
    platformio/framework-espidf@3.50500.0
    platformio/toolchain-riscv32-esp@14.2.0+20241119
board = esp32-c3-devkitm-1
framework = espidf
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
build_flags = -DREADER_LED_ACTIVE_LEVEL=0 -fstack-usage
board_build.embed_files =
    web/offline-index.html
    web/offline.css
    web/offline.js
    web/offline-i18n.js
    web/preferences.js
    web/decoder.js
    web/decoder_reference.json
    web/bafang-battery.js
    web/can-live.js
    web/can-live.css
    web/spard-can.js
    web/spard-information.js
    web/kolumbus-logo.svg
    web/icon.svg
