[env:esp32c3]
platform = espressif32@6.12.0
platform_packages =
    platformio/framework-espidf@3.50500.0
    platformio/toolchain-riscv32-esp@14.2.0+20241119
board = esp32-c3-devkitm-1
framework = espidf
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
build_flags = -DREADER_LED_ACTIVE_LEVEL=0 -fstack-usage
board_build.embed_files =
    web/spard-can.js
    web/battery-query.js
    web/esp-battery.js
    web/index.html
    web/can-live.js
    web/can-live.css
    web/style.css
    web/app.js
    web/auto-update.js
    web/remote-console.js
    web/remote-console.css
    web/files.js
    web/adapter.js
    web/spard-probe.js
    web/spard-information.js
    web/spard-battery.js
    web/decoder.js
    web/metrics.js
    web/decoder_reference.json
    web/capture_profiles.json
    web/store.js
    web/transport.js
    web/tuning.js
    web/browser.js
    web/monitor.js
    web/support.js
    web/flash-core.js
    web/remote-flash.js
    web/archive-worker.js
    web/sw.js
    web/manifest.webmanifest
    web/icon.svg
    web/kolumbus-logo.svg
    web/preferences.js
    web/i18n.js
    web/appearance.css
    web/bafang-battery.js
    web/reader-selftest.js

    web/esp-remote.js
