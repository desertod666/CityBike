name: Test site and server without devices
on:
  workflow_dispatch:
  pull_request:
    paths: [web/**, server/**, pc/**, scripts/**, reader/web/**, reader/SOURCE_MANIFEST.json, .github/workflows/app-ci.yml]
  push:
    branches: [main]
    paths: [web/**, server/**, pc/**, scripts/**, reader/web/**, reader/SOURCE_MANIFEST.json, .github/workflows/app-ci.yml]
permissions:
  contents: read
concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Check runner Node
        run: node -e "if(Number(process.versions.node.split('.')[0])<20)process.exit(1)"
      - name: Install pinned browser test dependency
        run: npm install --no-save --ignore-scripts playwright@1.56.1 fake-indexeddb@6.2.6
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test button ordering, freshness, context, API and real worker update
        run: python scripts/test_app_regressions.py --browser
