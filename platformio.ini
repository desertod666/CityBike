[env:esp32c3]
; Archived root firmware. build.bat and flash.bat use reader/ instead.
extra_scripts = pre:scripts/require_reader_project.py
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = espidf
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
build_flags = -DREADER_LED_ACTIVE_LEVEL=0
board_build.embed_files =
    web/index.html
    web/style.css
    web/app.js
    web/auto-update.js
    web/remote-console.js
    web/remote-console.css
    web/files.js
    web/adapter.js
    web/spard-probe.js
    web/spard-information.js
    web/spard-battery.js
    web/decoder.js
    web/metrics.js
    web/decoder_reference.json
    web/capture_profiles.json
    web/store.js
    web/transport.js
    web/tuning.js
    web/browser.js
    web/monitor.js
    web/support.js
    web/flash-core.js
    web/remote-flash.js
    web/archive-worker.js
    web/sw.js
    web/manifest.webmanifest
    web/icon.svg
